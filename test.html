<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Course Nocturne - Garage E39 Edition</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        p { color: #aaa; margin-bottom: 15px; }
        .game-container {
            position: relative;
            display: inline-block;
        }
        canvas {
            background-color: #333;
            border: 4px solid #555;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }
        .instructions { margin-top: 15px; font-weight: bold; color: #4CAF50; }
    </style>
</head>
<body>

    <h1>Course Nocturne</h1>
    <p>Fais chanter le 6 cylindres (M52B20TU), gagne des crédits et customise ton bolide !</p>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    
    <div class="instructions">
        Flèches GAUCHE/DROITE (ou Q/D) pour piloter | ESPACE pour le Boost !
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // États du jeu : 'MENU', 'GARAGE', 'PLAYING', 'GAMEOVER'
        let gameState = 'MENU';

        // Données du joueur & Sauvegarde (localStorage)
        let money = parseInt(localStorage.getItem("e39_money")) || 150;
        let highScore = parseInt(localStorage.getItem("e39_high_score")) || 0;
        
        let unlockedCars = JSON.parse(localStorage.getItem("e39_unlocked_cars")) || ["Oxford Green"];
        let currentCar = localStorage.getItem("e39_current_car") || "Oxford Green";

        let unlockedRoads = JSON.parse(localStorage.getItem("e39_unlocked_roads")) || ["Nuit Classique"];
        let currentRoad = localStorage.getItem("e39_current_road") || "Nuit Classique";

        const carsData = {
            "Oxford Green": { color: "#1b3022", price: 0 },
            "Imolarot Red": { color: "#990000", price: 200 },
            "Titanium Silver": { color: "#C0C0C0", price: 350 },
            "Cosmos Black": { color: "#111111", price: 500 }
        };

        const roadsData = {
            "Nuit Classique": { asphalt: "#333", grass: "#1a4d1a", price: 0 },
            "Sunset Highway": { asphalt: "#4a3b5c", grass: "#5c1a1a", price: 300 },
            "Neon Cyber": { asphalt: "#111a2e", grass: "#0d003b", price: 600 }
        };

        // Audio Web API
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'boost') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(450, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'buy') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let player = { x: 175, y: 480, width: 45, height: 80, speed: 6 };
        let traffic = [];
        let score = 0;
        let earnedMoney = 0;
        let gameSpeed = 4;
        let isBoosting = false;

        let keys = {};
        window.addEventListener("keydown", (e) => { 
            keys[e.key] = true; 
            initAudio();
            if (e.key === " " && !isBoosting && gameState === 'PLAYING') {
                isBoosting = true;
                playSound('boost');
                setTimeout(() => { isBoosting = false; }, 800);
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        function saveGame() {
            localStorage.setItem("e39_money", money);
            localStorage.setItem("e39_high_score", highScore);
            localStorage.setItem("e39_unlocked_cars", JSON.stringify(unlockedCars));
            localStorage.setItem("e39_current_car", currentCar);
            localStorage.setItem("e39_unlocked_roads", JSON.stringify(unlockedRoads));
            localStorage.setItem("e39_current_road", currentRoad);
        }

        function drawPlayer() {
            let bodyColor = carsData[currentCar].color;

            if (isBoosting) {
                ctx.fillStyle = "rgba(135, 206, 250, 0.4)";
                ctx.fillRect(player.x - 4, player.y + 10, player.width + 8, player.height + 15);
            }

            ctx.fillStyle = bodyColor; 
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            ctx.fillStyle = "#111";
            ctx.fillRect(player.x + 6, player.y + 22, player.width - 12, 35);

            ctx.fillStyle = "#87CEFA";
            ctx.fillRect(player.x + 8, player.y + 24, player.width - 16, 12);
            ctx.fillRect(player.x + 8, player.y + 43, player.width - 16, 10);
            
            ctx.fillStyle = "#fffae6";
            ctx.fillRect(player.x + 4, player.y, 8, 4);
            ctx.fillRect(player.x + player.width - 12, player.y, 8, 4);

            ctx.fillStyle = "#ff0000";
            ctx.fillRect(player.x + 4, player.y + player.height - 4, 10, 4);
            ctx.fillRect(player.x + player.width - 14, player.y + player.height - 4, 10, 4);
        }

        function spawnTraffic() {
            let carWidth = 45;
            let lanes = [50, 145, 240, 305];
            let randomX = lanes[Math.floor(Math.random() * lanes.length)];

            traffic.push({
                x: randomX,
                y: -100,
                width: carWidth,
                height: 80,
                speed: gameSpeed * 0.6 + (Math.random() * 1.5),
                color: ["#cc0000", "#002b80", "#e6b800", "#555555"][Math.floor(Math.random() * 4)]
            });
        }

        function updateGame() {
            if (gameState !== 'PLAYING') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let roadInfo = roadsData[currentRoad];

            ctx.fillStyle = roadInfo.asphalt;
            ctx.fillRect(30, 0, canvas.width - 60, canvas.height);

            ctx.fillStyle = roadInfo.grass;
            ctx.fillRect(0, 0, 30, canvas.height);
            ctx.fillRect(canvas.width - 30, 0, 30, canvas.height);

            let currentSpeed = isBoosting ? gameSpeed * 2.2 : gameSpeed;
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([25, 25]);
            ctx.lineWidth = 4;
            ctx.lineDashOffset -= currentSpeed * 1.5;

            ctx.beginPath();
            ctx.moveTo(125, 0); ctx.lineTo(125, canvas.height); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(220, 0); ctx.lineTo(220, canvas.height); ctx.stroke();

            let currentMoveSpeed = isBoosting ? player.speed * 1.6 : player.speed;
            if ((keys["ArrowLeft"] || keys["q"] || keys["Q"]) && player.x > 35) {
                player.x -= currentMoveSpeed;
            }
            if ((keys["ArrowRight"] || keys["d"] || keys["D"]) && player.x + player.width < canvas.width - 35) {
                player.x += currentMoveSpeed;
            }

            drawPlayer();

            for (let i = 0; i < traffic.length; i++) {
                let car = traffic[i];
                car.y += currentSpeed;

                ctx.fillStyle = car.color;
                ctx.fillRect(car.x, car.y, car.width, car.height);
                
                ctx.fillStyle = "#222";
                ctx.fillRect(car.x + 5, car.y + 20, car.width - 10, 20);

                if (player.x < car.x + car.width &&
                    player.x + player.width > car.x &&
                    player.y < car.y + car.height &&
                    player.y + player.height > car.y) {
                    gameState = 'GAMEOVER';
                    playSound('crash');
                    
                    earnedMoney = Math.floor(score / 5);
                    money += earnedMoney;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("e39_high_score", highScore);
                    }
                    saveGame();
                }
            }

            traffic = traffic.filter(car => {
                if (car.y > canvas.height) {
                    score += isBoosting ? 20 : 10;
                    if (score % 50 === 0) gameSpeed += 0.4;
                    return false;
                }
                return true;
            });

            // HUD en jeu (correction des coordonnées pour éviter le rognage)
            ctx.fillStyle = "white";
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "left";
            ctx.fillText("SCORE : " + score, 40, 28);
            ctx.fillText("PIÈCES : " + money + " 🪙", 40, 48);
            ctx.textAlign = "right";
            ctx.fillText("VIT : " + Math.floor(currentSpeed * 25) + " km/h", canvas.width - 40, 28);
            ctx.textAlign = "left";

            if (Math.random() < 0.022 + (score * 0.00005)) {
                spawnTraffic();
            }

            requestAnimationFrame(updateGame);
        }

        // Boucle principale d'affichage des menus et du game over
        function drawUI() {
            if (gameState === 'PLAYING') {
                requestAnimationFrame(drawUI);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#1e1e2f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'MENU') {
                canvas.style.cursor = "default";
                ctx.textAlign = "center";
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 30px sans-serif";
                ctx.fillText("COURSE NOCTURNE", canvas.width / 2, 100);

                ctx.fillStyle = "white";
                ctx.font = "16px sans-serif";
                ctx.fillText("🪙 Pièces : " + money, canvas.width / 2, 150);
                ctx.fillText("🏆 Meilleur Score : " + highScore, canvas.width / 2, 180);

                drawButton(canvas.width / 2 - 100, 240, 200, 50, "#4CAF50", "JOUER");
                drawButton(canvas.width / 2 - 100, 310, 200, 50, "#2196F3", "GARAGE / BOUTIQUE");

            } else if (gameState === 'GARAGE') {
                canvas.style.cursor = "default";
                ctx.textAlign = "center";
                ctx.fillStyle = "#2196F3";
                ctx.font = "bold 26px sans-serif";
                ctx.fillText("GARAGE & BOUTIQUE", canvas.width / 2, 45);

                ctx.fillStyle = "white";
                ctx.font = "14px sans-serif";
                ctx.fillText("🪙 Solde : " + money + " pièces", canvas.width / 2, 75);

                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 15px sans-serif";
                ctx.fillText("— Peintures de la Voiture —", canvas.width / 2, 105);

                let carKeys = Object.keys(carsData);
                carKeys.forEach((carName, index) => {
                    let y = 125 + index * 40;
                    let isUnlocked = unlockedCars.includes(carName);
                    let isSelected = currentCar === carName;

                    ctx.fillStyle = isSelected ? "#4CAF50" : "#333";
                    ctx.fillRect(30, y, canvas.width - 60, 32);

                    ctx.fillStyle = "white";
                    ctx.font = "13px sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText(carName + (isSelected ? " (Équipé)" : ""), 45, y + 21);

                    ctx.textAlign = "right";
                    if (isUnlocked) {
                        ctx.fillText("Possédé", canvas.width - 45, y + 21);
                    } else {
                        ctx.fillText(carsData[carName].price + " 🪙", canvas.width - 45, y + 21);
                    }
                });

                ctx.textAlign = "center";
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 15px sans-serif";
                ctx.fillText("— Décors de Route —", canvas.width / 2, 305);

                let roadKeys = Object.keys(roadsData);
                roadKeys.forEach((roadName, index) => {
                    let y = 325 + index * 40;
                    let isUnlocked = unlockedRoads.includes(roadName);
                    let isSelected = currentRoad === roadName;

                    ctx.fillStyle = isSelected ? "#4CAF50" : "#333";
                    ctx.fillRect(30, y, canvas.width - 60, 32);

                    ctx.fillStyle = "white";
                    ctx.font = "13px sans-serif";
                    ctx.textAlign = "left";
                    ctx.fillText(roadName + (isSelected ? " (Actif)" : ""), 45, y + 21);

                    ctx.textAlign = "right";
                    if (isUnlocked) {
                        ctx.fillText("Débloqué", canvas.width - 45, y + 21);
                    } else {
                        ctx.fillText(roadsData[roadName].price + " 🪙", canvas.width - 45, y + 21);
                    }
                });

                drawButton(canvas.width / 2 - 100, 530, 200, 38, "#777", "RETOUR AU MENU");

            } else if (gameState === 'GAMEOVER') {
                canvas.style.cursor = "default";
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.textAlign = "center";
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 38px sans-serif";
                ctx.fillText("CRASH !", canvas.width / 2, 130);
                
                ctx.font = "16px sans-serif";
                ctx.fillStyle = "#ffcc00";
                ctx.fillText("Le M52B20 a calé...", canvas.width / 2, 165);
                
                ctx.fillStyle = "white";
                ctx.font = "16px sans-serif";
                ctx.fillText("Score final : " + score, canvas.width / 2, 210);
                ctx.fillText("Pièces gagnées : +" + earnedMoney + " 🪙", canvas.width / 2, 240);
                ctx.fillText("Solde total : " + money + " 🪙", canvas.width / 2, 270);

                drawButton(canvas.width / 2 - 100, 330, 200, 45, "#4CAF50", "REJOUER");
                drawButton(canvas.width / 2 - 100, 395, 200, 45, "#2196F3", "MENU PRINCIPAL");
            }

            requestAnimationFrame(drawUI);
        }

        function drawButton(x, y, w, h, color, text) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "white";
            ctx.font = "bold 15px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x + w / 2, y + h / 2);
            ctx.textBaseline = "alphabetic";
            ctx.textAlign = "left";
        }

        canvas.addEventListener("click", function(e) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (gameState === 'MENU') {
                if (mouseX >= canvas.width/2 - 100 && mouseX <= canvas.width/2 + 100 && mouseY >= 240 && mouseY <= 290) {
                    startGame();
                } else if (mouseX >= canvas.width/2 - 100 && mouseX <= canvas.width/2 + 100 && mouseY >= 310 && mouseY <= 360) {
                    gameState = 'GARAGE';
                }
            } else if (gameState === 'GARAGE') {
                if (mouseX >= canvas.width/2 - 100 && mouseX <= canvas.width/2 + 100 && mouseY >= 530 && mouseY <= 568) {
                    gameState = 'MENU';
                    saveGame();
                    return;
                }

                let carKeys = Object.keys(carsData);
                carKeys.forEach((carName, index) => {
                    let y = 125 + index * 40;
                    if (mouseX >= 30 && mouseX <= canvas.width - 30 && mouseY >= y && mouseY <= y + 32) {
                        if (unlockedCars.includes(carName)) {
                            currentCar = carName;
                            playSound('buy');
                        } else {
                            let price = carsData[carName].price;
                            if (money >= price) {
                                money -= price;
                                unlockedCars.push(carName);
                                currentCar = carName;
                                playSound('buy');
                                saveGame();
                            }
                        }
                    }
                });

                let roadKeys = Object.keys(roadsData);
                roadKeys.forEach((roadName, index) => {
                    let y = 325 + index * 40;
                    if (mouseX >= 30 && mouseX <= canvas.width - 30 && mouseY >= y && mouseY <= y + 32) {
                        if (unlockedRoads.includes(roadName)) {
                            currentRoad = roadName;
                            playSound('buy');
                        } else {
                            let price = roadsData[roadName].price;
                            if (money >= price) {
                                money -= price;
                                unlockedRoads.push(roadName);
                                currentRoad = roadName;
                                playSound('buy');
                                saveGame();
                            }
                        }
                    }
                });

            } else if (gameState === 'GAMEOVER') {
                if (mouseX >= canvas.width/2 - 100 && mouseX <= canvas.width/2 + 100 && mouseY >= 330 && mouseY <= 375) {
                    startGame();
                } else if (mouseX >= canvas.width/2 - 100 && mouseX <= canvas.width/2 + 100 && mouseY >= 395 && mouseY <= 440) {
                    gameState = 'MENU';
                }
            }
        });

        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            gameSpeed = 4;
            traffic = [];
            player.x = 175;
            updateGame();
        }

        // Lancement de la boucle d'interface principale
        drawUI();
    </script>
</body>
</html>
